name: Android CI

on:
  workflow_dispatch: # 保持配置：只在 GitHub 网页上手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. ✨ 核心步骤：在云端编译前，自动解压资产目录中的 dict.zip，释放出真正的数据库 dict.db
      - name: Unzip Large Database
        run: |
          cd app/src/main/assets/
          if [ -f "dict.zip" ]; then
            echo "发现 dict.zip，正在释放 41.7M 高性能 SQLite 数据库..."
            unzip -o dict.zip
            rm dict.zip
            echo "✅ 数据库解压完成，临时压缩包已清理。"
          else
            echo "⚠️ 未发现 dict.zip，请确保本地已正确放置该压缩包！"
          fi

      # 3. 设置 JDK 环境
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: 'gradle'

      # 4. 赋予 Gradle 执行权限
      - name: Grant execute permission
        run: chmod +x ./gradlew

      # 5. 编译 Debug 版本的 APK
      - name: Build APK
        run: ./gradlew assembleDebug

      # 6. 将编译生成的 APK 上传到 Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DictionaryHelper-APK
          path: app/build/outputs/apk/debug/app-debug.apk
